name: Keep-alive

# Pings the deployed /health endpoint so free hosting + Neon never spin down,
# keeping QR tracking and the live dashboard available 24/7.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          URL="${{ vars.BASE_URL || secrets.BASE_URL }}"
          if [ -z "$URL" ]; then
            echo "::warning::BASE_URL repo variable/secret is not set; skipping ping."
            exit 0
          fi
          for i in 1 2 3; do
            code=$(curl -fsS -o /tmp/health.txt -w "%{http_code}" "$URL/health" || true)
            echo "Attempt $i -> HTTP $code"
            cat /tmp/health.txt 2>/dev/null || true
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 20
          done
          echo "::error::Health check failed after retries."
          exit 1
